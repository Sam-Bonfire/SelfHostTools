<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>403 - Restricted Zone</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;700;900&display=swap" rel="stylesheet" />
    <style>
      :root {
        --font-main: 'Outfit', sans-serif;
        --color-black: #000000;
        --color-white: #ffffff;
        --color-red: #f87171;
        /* red-400 */
        --shadow-hard: 8px 8px 0px 0px rgba(0, 0, 0, 1);
      }

      body {
        margin: 0;
        font-family: var(--font-main);
        background-color: var(--color-white);
        color: var(--color-black);
        display: flex;
        flex-direction: column;
        min-height: 100vh;
        align-items: center;
        justify-content: center;
        padding: 1rem;
      }

      .card {
        background-color: var(--color-red);
        border: 4px solid var(--color-black);
        box-shadow: var(--shadow-hard);
        padding: 2rem 2rem 3rem 2rem;
        max-width: 32rem;
        /* matches max-w-lg approx */
        width: 100%;
        text-align: center;
        box-sizing: border-box;
        transform: rotate(1deg);
      }

      .icon-container {
        background-color: var(--color-white);
        border: 4px solid var(--color-black);
        border-radius: 9999px;
        padding: 1rem;
        display: inline-flex;
        margin-bottom: 1.5rem;
        box-shadow: 4px 4px 0px 0px rgba(0, 0, 0, 1);
      }

      h1 {
        font-size: 3.75rem;
        font-weight: 900;
        margin: 0 0 0.5rem 0;
        line-height: 1;
        color: var(--color-white);
        text-shadow: 4px 4px 0px rgba(0, 0, 0, 1);
      }

      h2 {
        font-size: 1.5rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        margin: 0 0 1.5rem 0;
        background-color: var(--color-black);
        color: var(--color-white);
        display: inline-block;
        padding: 0 0.5rem;
        transform: rotate(-1deg);
      }

      p {
        font-size: 1.125rem;
        font-weight: 700;
        margin: 0 0 2rem 0;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        background-color: var(--color-white);
        color: var(--color-black);
        border: 4px solid var(--color-black);
        box-shadow: none;
        padding: 0.75rem 2rem;
        font-weight: 700;
        font-size: 1.125rem;
        text-decoration: none;
        transition: all 0.1s;
        cursor: pointer;
      }

      .btn:hover {
        transform: translateY(-4px);
        background-color: #f3f4f6;
      }

      footer {
        margin-top: 3rem;
        text-align: center;
        font-weight: 700;
        color: #4b5563;
      }

      .heart {
        display: inline-block;
        margin: 0 0.25rem;
        padding: 0 0.25rem;
        background-color: #ff6b6b;
        color: #000000;
        border: 2px solid #000000;
        transform: rotate(3deg);
      }
    </style>
  </head>

  <body>
    <div class="card">
      <div class="icon-container">
        <svg
          width="64"
          height="64"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
      </div>

      <h1>403</h1>
      <br />
      <h2>Restricted Zone</h2>

      <p>
        Stop right there! You don't have the clearance.<br />
        This area is strictly for authorized personnel (or future you).
      </p>

      <a href="/" class="btn">
        <svg
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
          <polyline points="9 22 9 12 15 12 15 22"></polyline>
        </svg>
        Back to Calculator Base
      </a>
    </div>

    <footer>
      <p>
        ©
        <script>
          document.write(new Date().getFullYear());
        </script>
        Calculators Hub. Built with
        <span class="heart">♥</span>
        and Neo-Brutalism.
      </p>
    </footer>
  </body>
</html>
